services:
  # 1. The PostgreSQL Database
  - type: pserv
    name: vlf-database
    runtime: postgres
    engineVersion: 15
    plan: free

  # 2. The Backend API Service
  - type: web
    name: vlf-api
    runtime: docker
    dockerfilePath: ./packages/api/Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromService:
          type: pserv
          name: vlf-database
          property: connectionString
      - key: JWT_SECRET # IMPORTANT: Set this manually in the Render dashboard
      - key: NODE_ENV
        value: production
    autoDeploy: true
    preDeployCommand: "npm install --workspaces --omit=dev && npm run prisma --workspace=api -- migrate deploy"
