services:
  # 1. The PostgreSQL Database
  - type: pserv
    name: vlf-database
    runtime: postgres
    postgresMajorVersion: 15
    plan: free

  # 2. The Backend API Service
  - type: web
    name: vlf-api
    runtime: docker
    dockerfilePath: ./packages/api/Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromService:
          type: pserv
          name: vlf-database
          property: connectionString
      - key: NODE_ENV
        value: production