# render.yaml - Configuración corregida para Render

databases:
  # 1. The PostgreSQL Database
  - name: vlf-database
    plan: free
    postgresMajorVersion: "15" # Especifica la versión como un string

services:
  # 2. The Backend API Service
  - type: web
    name: vlf-api
    runtime: docker
    dockerfilePath: ./packages/api/Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase: # Corregido: Referencia a un 'database', no a un 'service'
          name: vlf-database
          property: connectionString
      - key: JWT_SECRET
        generateValue: true # Corregido: Render gestionará el secreto automáticamente
      - key: NODE_ENV
        value: production
    autoDeploy: true
