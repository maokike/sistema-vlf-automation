version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: vlf_reports
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./packages/api
      dockerfile: Dockerfile.dev
    ports:
      - '4000:4000'
    volumes:
      - ./packages/api:/usr/src/app
    depends_on:
      - db
    environment:
      DATABASE_URL: "postgresql://user:password@db:5432/vlf_reports"

  web:
    build:
      context: ./packages/web
      dockerfile: Dockerfile.dev
    ports:
      - '3000:3000'
    volumes:
      - ./packages/web:/usr/src/app
    depends_on:
      - api

volumes:
  postgres_data:
